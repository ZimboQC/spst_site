<style>
  :root{
    --navy:#0e1f4d;
    --navy-deep:#091333;
    --yellow:#c9a227;
    --text-dark:#14213d;
    --text-body:#4a5170;
    --border:#dfe4f0;
    --brand-grad:linear-gradient(135deg, #003da5, #1e295c);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--text-body);
    background:#f5f6f9;
    min-height:100dvh;
    display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  nav{
    background:#fff; border-bottom:1px solid var(--border);
  }
  nav .bar{
    max-width:720px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:44px; height:44px; box-sizing:border-box; padding:6px;
    border-radius:10px; background:#1e295c;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{width:100%; height:100%; display:block;}
  .brand .name{font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; line-height:1.2; color:var(--navy);}
  .back{font-weight:600; font-size:14px; color:var(--navy);}
  .back:hover{color:#003da5;}
  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .card{
    background:#fff; border:1px solid var(--border); border-radius:20px;
    padding:36px 32px 32px; text-align:center; max-width:440px; width:100%;
  }
  h1{
    font-family:'Poppins',sans-serif; font-size:24px; color:var(--text-dark);
    margin-bottom:8px;
  }
  .url{
    font-weight:600; font-size:15px; color:#003da5; margin-bottom:24px;
    word-break:break-all;
  }
  .qr{
    background:#fff; border-radius:16px; padding:8px;
    display:inline-block;
  }
  .qr img, .qr svg{width:min(280px, 70vw); height:auto; display:block;}
  .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px;}
  .btn{
    padding:11px 18px; border-radius:8px; font-weight:700; font-size:14px;
    display:inline-block;
  }
  .btn-gradient{background:var(--brand-grad); color:#fff;}
  .btn-outline{border:1.5px solid var(--navy); color:var(--navy);}
  .hint{font-size:13px; color:#8a92ac; margin-top:16px;}
  footer{
    text-align:center; font-size:12px; color:#7f88a8;
    padding:20px; background:var(--navy-deep);
  }
  @media print{
    nav, .actions, footer, .hint{display:none;}
    body{background:#fff;}
    .card{border:none; padding:0;}
    .qr img{width:70mm;}
  }
</style>
</head>
